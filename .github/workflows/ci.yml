name: ci
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build -A x64
      - name: build
        run: cmake --build build --config Release
      - name: test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: cli
        run: |
          .\build\Release\hdrchain.exe genesis gen.hdrc coinbase
          .\build\Release\hdrchain.exe append gen.hdrc next-tx
          .\build\Release\hdrchain.exe verify gen.hdrc
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build -j
      - name: test
        run: ctest --test-dir build --output-on-failure
      - name: cli
        run: |
          ./build/hdrchain genesis gen.hdrc coinbase
          ./build/hdrchain append gen.hdrc next-tx
          ./build/hdrchain verify gen.hdrc
